services:
  - type: web
    name: vg-23l-0548-a2-ops
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 1 --timeout 180 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"
      - key: MODEL_PATH
        value: models/champion/visionguard.keras
      - key: DATABASE_URL
        value: sqlite:////tmp/visionguard.db
